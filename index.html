        .auth-card {

            border-top: 5px solid var(--primary-color);

        .auth-card h2 {

            color: var(--primary-dark);
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .auth-card p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        .auth-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .auth-input-group input {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        .auth-input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.4);
        }

        .auth-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;

        .auth-btn:hover {
            background-color: var(--primary-dark);
        }

        .auth-error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;

        .main-content {

        .container {

        .header {

            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;

            font-weight: bold;

        .logout-btn {

            border: none;

            border-radius: 4px;

            font-weight: bold;
            margin-bottom: 5px;

            background-color: #f1f1f1;
            font-weight: bold;
            color: #2b7a78;

        .button-group {
            grid-column: 1 / -1;

            gap: 10px;
            margin-top: 10px;

        .submit-btn {

            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;

        .submit-btn:hover {

        }

        .cancel-btn {

            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }

        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .filter-grid .form-group {
            flex: 1;
            min-width: 150px;
        }

        .btn-search {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            height: 41px;
        }

        .btn-search:hover {
            background-color: #0056b3;
        }

        .btn-reset {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            height: 41px;
        }

        .btn-reset:hover {
            background-color: #545b62;
        }

        .btn-excel {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            height: 41px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-excel:hover {
            background-color: #218838;
        }

        .summary-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            margin-bottom: 20px;

        .summary-card {

        .table-container {

        table {

<!-- 관리자 로그인 모달 오버레이 -->
<div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
        <h2 id="auth-title">🔒 관리자 로그인</h2>

                    <option value="">-- 이메일 선택 (또는 직접 입력) --</option>
                    <option value="jimmylim0309@gmail.com">jimmylim0309@gmail.com</option>

<!-- 본문 콘텐츠 (인증 후 노출) -->
<div id="main-content" class="main-content">
    <div class="container">
        <div class="header">
            <h1 id="title-text">항텅솜분 태국금 판매 수익 관리</h1>
            <div class="header-actions">
                <button class="lang-btn" id="lang-toggle-btn">ภาษาไทย로 변경</button>
                <button class="logout-btn" id="logout-btn">로그아웃</button>
            </div>
        </div>

        <!-- 입력 폼 -->
        <div class="card">
            <form id="sales-form">
                <input type="hidden" id="edit_id" value="">
                <div class="form-grid">
                    <div class="form-group">
                        <label id="lbl-sale-date">1. 날짜</label>
                        <input type="date" id="sale_date" required>
                    </div>

                    <div class="form-group">
                        <label id="lbl-item-type">2-1. 아이템 종류</label>
                        <select id="item_type" required>
                            <option value="목걸이">목걸이 (สร้อยคอ)</option>
                            <option value="팔찌">팔찌 (สร้อยข้อมือ)</option>
                            <option value="반지">반지 (แหวน)</option>
                            <option value="귀걸이">귀걸이 (ต่างหู)</option>
                            <option value="골드바">골드바 (ทองคำแท่ง)</option>
                            <option value="펜던트">펜던트 (จี้)</option>
                            <option value="어린이상품">어린이상품 (สินค้าเด็ก)</option>
                            <option value="실버제품">실버제품 (เครื่องเงิน)</option>
                            <option value="기타">기타 (기타/etc)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="lbl-weight">2-2. 무게 (g)</label>
                        <input type="number" id="weight_g" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label id="lbl-channel">3-1. 유입경로</label>
                        <select id="channel" required>
                            <option value="FB">FB</option>
                            <option value="Line">Line</option>
                            <option value="적립">적립 (สะสมแต้ม)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="lbl-customer-name">3-2. 고객이름</label>
                        <input type="text" id="customer_name" required>
                    </div>

                    <div class="form-group">
                        <label id="lbl-phone">3-3. 전화번호</label>
                        <input type="tel" id="phone" placeholder="08X-XXX-XXXX">
                    </div>

                    <div class="form-group">
                        <label id="lbl-selling-price">4-1. 판매가</label>
                        <input type="number" id="selling_price" step="0.01" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label id="lbl-cost-price">4-2. 매입가</label>
                        <input type="number" id="cost_price" step="0.01" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label id="lbl-profit">4-3. 수익 (자동계산)</label>
                        <input type="number" id="profit" readonly value="0">
                    </div>

                    <div class="form-group">
                        <label id="lbl-remit-bank">5. 송금은행</label>
                        <input type="text" id="remit_bank" placeholder="예: KBank, SCB">
                    </div>

                    <div class="form-group">
                        <label id="lbl-deposit-bank">6. 입금은행</label>
                        <input type="text" id="deposit_bank" placeholder="예: 국민은행">
                    </div>

                    <div class="button-group">
                        <button type="submit" class="submit-btn" id="btn-submit">등록하기</button>
                        <button type="button" class="cancel-btn" id="btn-cancel">취소</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 날짜 조회 필터 및 엑셀 다운로드 카드 -->
        <div class="card">
            <div class="filter-grid">
                <div class="form-group">
                    <label id="lbl-filter-start">조회 시작일</label>
                    <input type="date" id="filter_start_date">
                </div>
                <div class="form-group">
                    <label id="lbl-filter-end">조회 종료일</label>
                    <input type="date" id="filter_end_date">
                </div>
                <button type="button" class="btn-search" id="btn-search">조회</button>
                <button type="button" class="btn-reset" id="btn-reset">초기화</button>
                <button type="button" class="btn-excel" id="btn-excel">📊 엑셀 다운로드</button>
            </div>
        </div>

        <!-- 합계 요약 대시보드 -->
        <div class="summary-container">
            <div class="summary-card count">
                <div class="summary-title" id="lbl-total-count">총 판매 건수</div>
                <div class="summary-value" id="val-total-count">0건</div>
            </div>
            <div class="summary-card selling">
                <div class="summary-title" id="lbl-total-selling">총 판매가 합계</div>
                <div class="summary-value" id="val-total-selling">0</div>
            </div>
            <div class="summary-card cost">
                <div class="summary-title" id="lbl-total-cost">총 매입가 합계</div>
                <div class="summary-value" id="val-total-cost">0</div>
            </div>
            <div class="summary-card profit">
                <div class="summary-title" id="lbl-total-profit">총 수익 합계</div>
                <div class="summary-value profit-text" id="val-total-profit">0</div>
            </div>
        </div>

        <!-- 판매 내역 테이블 -->
        <div class="card table-container">
            <table>
                <thead>
                    <tr>
                        <th id="th-id">순번</th>
                        <th id="th-sale-date">날짜</th>
                        <th id="th-item-type">종류</th>
                        <th id="th-weight">무게(g)</th>
                        <th id="th-channel">유입경로</th>
                        <th id="th-customer">고객명</th>
                        <th id="th-phone">전화번호</th>
                        <th id="th-selling">판매가</th>
                        <th id="th-cost">매입가</th>
                        <th id="th-profit">수익</th>
                        <th id="th-remit">송금은행</th>
                        <th id="th-deposit">입금은행</th>
                        <th id="th-action">관리</th>
                    </tr>
                </thead>
                <tbody id="sales-list">
                    <!-- 동적 데이터 삽입 영역 -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="7" id="tf-label" style="text-align: right; font-weight: bold;">조회 기간 합계</td>
                        <td id="tf-total-selling" class="profit-text" style="color:#007bff;">0</td>
                        <td id="tf-total-cost" style="color:#dc3545;">0</td>
                        <td id="tf-total-profit" class="profit-text">0</td>
                        <td colspan="3"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

    // Firebase Auth 로그인 처리
    async function handleLogin(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;
        const errorMsg = document.getElementById('auth-error-msg');

        try {
            await signInWithEmailAndPassword(auth, email, password);
            errorMsg.style.display = 'none';
        } catch (error) {
            console.error("Login failed:", error.code, error.message);
            
            // Firebase 인증 에러 코드별 세부 메시지 안내
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                errorMsg.innerText = currentLang === 'ko' 
                    ? "이메일 또는 비밀번호가 올바르지 않습니다. (비밀번호 확인 필요)" 
                    : "อีเมลหรือรหัสผ่านไม่ถูกต้อง (กรุณาตรวจสอบรหัสผ่าน)";
            } else if (error.code === 'auth/too-many-requests') {
                errorMsg.innerText = currentLang === 'ko' 
                    ? "로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요." 
                    : "พยายามเข้าสู่ระบบมากเกินไป กรุณาลองใหม่ในภายหลัง";
            } else {
                errorMsg.innerText = translations[currentLang].authErr;
            }
            errorMsg.style.display = 'block';
        }
    }

    // Firebase Auth 로그아웃 처리
    async function handleLogout() {
        try {
            await signOut(auth);
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-password').value = '';
            document.getElementById('admin-email-select').value = '';
        } catch (error) {
            console.error("Logout failed:", error);
        }
    }

    // 인증 상태 감지 (세션 자동 유지)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            setDefaultDate();
            loadSalesData();
        } else {
            document.getElementById('auth-overlay').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
        }
    });

    function setDefaultDate() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('sale_date').value = today;
    }

    function calculateProfit() {
        const selling = parseFloat(document.getElementById('selling_price').value) || 0;
        const cost = parseFloat(document.getElementById('cost_price').value) || 0;
        document.getElementById('profit').value = (selling - cost).toFixed(2);
    }

    document.getElementById('selling_price').addEventListener('input', calculateProfit);
    document.getElementById('cost_price').addEventListener('input', calculateProfit);

    // Firestore 데이터 조회
    async function loadSalesData() {
        const startDate = document.getElementById('filter_start_date').value;
        const endDate = document.getElementById('filter_end_date').value;

        const salesRef = collection(db, 'gold_sales');
        let queryConstraints = [];

        if (startDate) {
            queryConstraints.push(where('sale_date', '>=', startDate));
        }
        if (endDate) {
            queryConstraints.push(where('sale_date', '<=', endDate));
        }

        try {
            const q = query(salesRef, ...queryConstraints);
            const querySnapshot = await getDocs(q);

            salesDataStore = [];
            querySnapshot.forEach((docSnap) => {
                salesDataStore.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });

            salesDataStore.sort((a, b) => (b.sale_date || '').localeCompare(a.sale_date || ''));
            renderTableAndTotals(salesDataStore);
        } catch (error) {
            console.error('Data fetch error:', error);
            alert('데이터를 불러오는 중 오류가 발생했습니다: ' + error.message);
        }
    }

    // Firestore 등록 및 수정
    document.getElementById('sales-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const t = translations[currentLang];
        const editId = document.getElementById('edit_id').value;

        const sellingPrice = parseFloat(document.getElementById('selling_price').value) || 0;
        const costPrice = parseFloat(document.getElementById('cost_price').value) || 0;

        const formData = {
            sale_date: document.getElementById('sale_date').value,
            item_type: document.getElementById('item_type').value,
            weight_g: parseFloat(document.getElementById('weight_g').value) || 0,
            channel: document.getElementById('channel').value,
            customer_name: document.getElementById('customer_name').value,
            phone: document.getElementById('phone').value,
            selling_price: sellingPrice,
            cost_price: costPrice,
            profit: sellingPrice - costPrice,
            remit_bank: document.getElementById('remit_bank').value,
            deposit_bank: document.getElementById('deposit_bank').value
        };

        try {
            if (editId) {
                const docRef = doc(db, 'gold_sales', editId);
                await updateDoc(docRef, formData);
                alert(t.updateSuccess);
                cancelEdit();
            } else {
                formData.created_at = serverTimestamp();
                await addDoc(collection(db, 'gold_sales'), formData);
                alert(t.saveSuccess);
                document.getElementById('sales-form').reset();
                setDefaultDate();
                document.getElementById('profit').value = "0";
            }
            loadSalesData();
        } catch (error) {
            console.error('Error saving document:', error);
            alert('저장 중 오류가 발생했습니다: ' + error.message);
        }
    });

    function editRow(id) {
        const row = salesDataStore.find(item => item.id === id);
        if (!row) return;

        const t = translations[currentLang];
        document.getElementById('edit_id').value = row.id;
        document.getElementById('sale_date').value = row.sale_date || new Date().toISOString().split('T')[0];
        document.getElementById('item_type').value = row.item_type;
        document.getElementById('weight_g').value = row.weight_g;
        document.getElementById('channel').value = row.channel;
        document.getElementById('customer_name').value = row.customer_name;
        document.getElementById('phone').value = row.phone || '';
        document.getElementById('selling_price').value = row.selling_price;
        document.getElementById('cost_price').value = row.cost_price;
        document.getElementById('remit_bank').value = row.remit_bank || '';
        document.getElementById('deposit_bank').value = row.deposit_bank || '';
        calculateProfit();

        document.getElementById('btn-submit').innerText = t.updateBtn;
        document.getElementById('btn-cancel').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        const t = translations[currentLang];
        document.getElementById('edit_id').value = '';
        document.getElementById('sales-form').reset();
        setDefaultDate();
        document.getElementById('profit').value = "0";
        document.getElementById('btn-submit').innerText = t.submitBtn;
        document.getElementById('btn-cancel').style.display = 'none';
    }

    async function deleteRow(id) {
        const t = translations[currentLang];
        if (!confirm(t.confirmDelete)) return;

        try {
            await deleteDoc(doc(db, 'gold_sales', id));
            alert(t.deleteSuccess);
            if (document.getElementById('edit_id').value === id) {
                cancelEdit();
            }
            loadSalesData();
        } catch (error) {
            console.error('Error deleting document:', error);
            alert('삭제 중 오류가 발생했습니다: ' + error.message);
        }
    }

    function resetFilter() {
        document.getElementById('filter_start_date').value = '';
        document.getElementById('filter_end_date').value = '';
        loadSalesData();
    }

    function renderTableAndTotals(data) {
        const t = translations[currentLang];
        const tbody = document.getElementById('sales-list');
        tbody.innerHTML = '';

        let totalSelling = 0;
        let totalCost = 0;
        let totalProfit = 0;

        data.forEach((row, index) => {
            const selling = Number(row.selling_price) || 0;
            const cost = Number(row.cost_price) || 0;
            const profit = Number(row.profit) || (selling - cost);

            totalSelling += selling;
            totalCost += cost;
            totalProfit += profit;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${row.sale_date || '-'}</td>
                <td>${row.item_type}</td>
                <td>${row.weight_g}</td>
                <td>${row.channel}</td>
                <td>${row.customer_name}</td>
                <td>${row.phone || '-'}</td>
                <td>${selling.toLocaleString()}</td>
                <td>${cost.toLocaleString()}</td>
                <td class="profit-text">${profit.toLocaleString()}</td>
                <td>${row.remit_bank || '-'}</td>
                <td>${row.deposit_bank || '-'}</td>
                <td>
                    <div class="action-btn-group">
                        <button class="btn-edit-action btn-edit" data-id="${row.id}">${t.btnEdit}</button>
                        <button class="btn-delete-action btn-delete" data-id="${row.id}">${t.btnDelete}</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-edit-action').forEach(btn => {
            btn.addEventListener('click', (e) => editRow(e.target.dataset.id));
        });
        document.querySelectorAll('.btn-delete-action').forEach(btn => {
            btn.addEventListener('click', (e) => deleteRow(e.target.dataset.id));
        });

        document.getElementById('val-total-count').innerText = `${data.length.toLocaleString()}${t.countUnit}`;
        document.getElementById('val-total-selling').innerText = totalSelling.toLocaleString();
        document.getElementById('val-total-cost').innerText = totalCost.toLocaleString();
        document.getElementById('val-total-profit').innerText = totalProfit.toLocaleString();

        document.getElementById('tf-total-selling').innerText = totalSelling.toLocaleString();
        document.getElementById('tf-total-cost').innerText = totalCost.toLocaleString();
        document.getElementById('tf-total-profit').innerText = totalProfit.toLocaleString();
    }

    function exportToExcel() {
        const t = translations[currentLang];
        if (!salesDataStore || salesDataStore.length === 0) {
            alert(t.noDataExcel);
            return;
        }

        const excelRows = salesDataStore.map((row, idx) => ({
            [t.thId]: idx + 1,
            [t.thSaleDate]: row.sale_date || '',
            [t.thItemType]: row.item_type || '',
            [t.thWeight]: row.weight_g || 0,
            [t.thChannel]: row.channel || '',
            [t.thCustomer]: row.customer_name || '',
            [t.thPhone]: row.phone || '',
            [t.thSelling]: row.selling_price || 0,
            [t.thCost]: row.cost_price || 0,
            [t.thProfit]: row.profit || 0,
            [t.thRemit]: row.remit_bank || '',
            [t.thDeposit]: row.deposit_bank || ''
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "SalesData");

        const todayStr = new Date().toISOString().split('T')[0];
        const fileName = `Gold_Sales_${todayStr}.xlsx`;

        XLSX.writeFile(workbook, fileName);
    }

    document.getElementById('auth-form').addEventListener('submit', handleLogin);
    document.getElementById('logout-btn').addEventListener('click', handleLogout);
    document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);
    document.getElementById('btn-cancel').addEventListener('click', cancelEdit);
    document.getElementById('btn-search').addEventListener('click', loadSalesData);
    document.getElementById('btn-reset').addEventListener('click', resetFilter);
    document.getElementById('btn-excel').addEventListener('click', exportToExcel);
</script>
