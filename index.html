<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>항텅솜분 태국금 판매 수익 관리 / ระบบจัดการรายได้ทองไทย</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #d4af37;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #8b6b10;
        }

        .lang-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .form-group input[readonly] {
            background-color: #f1f1f1;
            font-weight: bold;
            color: #2b7a78;
        }

        .button-group {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-btn {
            flex: 1;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #218838;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }

        /* 날짜 조회 카드 */
        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .filter-grid .form-group {
            flex: 1;
            min-width: 150px;
        }

        .btn-search {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            height: 41px;
        }

        .btn-search:hover {
            background-color: #0056b3;
        }

        .btn-reset {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            height: 41px;
        }

        .btn-reset:hover {
            background-color: #545b62;
        }

        /* 합계 대시보드 카드리스트 */
        .summary-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 5px solid #6c757d;
        }

        .summary-card.selling {
            border-left-color: #007bff;
        }

        .summary-card.cost {
            border-left-color: #dc3545;
        }

        .summary-card.profit {
            border-left-color: #28a745;
        }

        .summary-title {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .summary-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #222;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            font-size: 0.88rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #f1f3f5;
            font-weight: bold;
        }

        tfoot tr {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .profit-text {
            color: #28a745;
            font-weight: bold;
        }

        .action-btn-group {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .btn-edit {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="title-text">항텅솜분 태국금 판매 수익 관리</h1>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-toggle-btn">ภาษาไทย로 변경</button>
    </div>

    <!-- 입력 폼 -->
    <div class="card">
        <form id="sales-form">
            <input type="hidden" id="edit_id" value="">
            <div class="form-grid">
                <div class="form-group">
                    <label id="lbl-sale-date">1. 날짜</label>
                    <input type="date" id="sale_date" required>
                </div>

                <div class="form-group">
                    <label id="lbl-item-type">2-1. 아이템 종류</label>
                    <select id="item_type" required>
                        <option value="목걸이">목걸이 (สร้อยคอ)</option>
                        <option value="팔찌">팔찌 (สร้อยข้อมือ)</option>
                        <option value="반지">반지 (แหวน)</option>
                        <option value="귀걸이">귀걸이 (ต่างหู)</option>
                        <option value="골드바">골드바 (ทองคำแท่ง)</option>
                        <option value="펜던트">펜던트 (จี้)</option>
                        <option value="어린이상품">어린이상품 (สินค้าเด็ก)</option>
                        <option value="실버제품">실버제품 (เครื่องเงิน)</option>
                        <option value="기타">기타 (기타/etc)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="lbl-weight">2-2. 무게 (g)</label>
                    <input type="number" id="weight_g" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label id="lbl-channel">3-1. 유입경로</label>
                    <select id="channel" required>
                        <option value="FB">FB</option>
                        <option value="Line">Line</option>
                        <option value="적립">적립 (สะสมแต้ม)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="lbl-customer-name">3-2. 고객이름</label>
                    <input type="text" id="customer_name" required>
                </div>

                <div class="form-group">
                    <label id="lbl-phone">3-3. 전화번호</label>
                    <input type="tel" id="phone" placeholder="08X-XXX-XXXX">
                </div>

                <div class="form-group">
                    <label id="lbl-selling-price">4-1. 판매가</label>
                    <input type="number" id="selling_price" step="0.01" placeholder="0" oninput="calculateProfit()" required>
                </div>

                <div class="form-group">
                    <label id="lbl-cost-price">4-2. 매입가</label>
                    <input type="number" id="cost_price" step="0.01" placeholder="0" oninput="calculateProfit()" required>
                </div>

                <div class="form-group">
                    <label id="lbl-profit">4-3. 수익 (자동계산)</label>
                    <input type="number" id="profit" readonly value="0">
                </div>

                <div class="form-group">
                    <label id="lbl-remit-bank">5. 송금은행</label>
                    <input type="text" id="remit_bank" placeholder="예: KBank, SCB">
                </div>

                <div class="form-group">
                    <label id="lbl-deposit-bank">6. 입금은행</label>
                    <input type="text" id="deposit_bank" placeholder="예: 국민은행">
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn" id="btn-submit">등록하기</button>
                    <button type="button" class="cancel-btn" id="btn-cancel" onclick="cancelEdit()">취소</button>
                </div>
            </div>
        </form>
    </div>

    <!-- 날짜 조회 필터 카드 -->
    <div class="card">
        <div class="filter-grid">
            <div class="form-group">
                <label id="lbl-filter-start">조회 시작일</label>
                <input type="date" id="filter_start_date">
            </div>
            <div class="form-group">
                <label id="lbl-filter-end">조회 종료일</label>
                <input type="date" id="filter_end_date">
            </div>
            <button type="button" class="btn-search" onclick="loadSalesData()" id="btn-search">조회</button>
            <button type="button" class="btn-reset" onclick="resetFilter()" id="btn-reset">초기화</button>
        </div>
    </div>

    <!-- 합계 요약 대시보드 -->
    <div class="summary-container">
        <div class="summary-card selling">
            <div class="summary-title" id="lbl-total-selling">총 판매가 합계</div>
            <div class="summary-value" id="val-total-selling">0</div>
        </div>
        <div class="summary-card cost">
            <div class="summary-title" id="lbl-total-cost">총 매입가 합계</div>
            <div class="summary-value" id="val-total-cost">0</div>
        </div>
        <div class="summary-card profit">
            <div class="summary-title" id="lbl-total-profit">총 수익 합계</div>
            <div class="summary-value profit-text" id="val-total-profit">0</div>
        </div>
    </div>

    <!-- 판매 내역 테이블 -->
    <div class="card table-container">
        <table>
            <thead>
                <tr>
                    <th id="th-id">순번</th>
                    <th id="th-sale-date">날짜</th>
                    <th id="th-item-type">종류</th>
                    <th id="th-weight">무게(g)</th>
                    <th id="th-channel">유입경로</th>
                    <th id="th-customer">고객명</th>
                    <th id="th-phone">전화번호</th>
                    <th id="th-selling">판매가</th>
                    <th id="th-cost">매입가</th>
                    <th id="th-profit">수익</th>
                    <th id="th-remit">송금은행</th>
                    <th id="th-deposit">입금은행</th>
                    <th id="th-action">관리</th>
                </tr>
            </thead>
            <tbody id="sales-list">
                <!-- 동적 데이터 삽입 영역 -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="7" id="tf-label" style="text-align: right; font-weight: bold;">조회 기간 합계</td>
                    <td id="tf-total-selling" class="profit-text" style="color:#007bff;">0</td>
                    <td id="tf-total-cost" style="color:#dc3545;">0</td>
                    <td id="tf-total-profit" class="profit-text">0</td>
                    <td colspan="3"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    // Supabase 정보 설정
    const SUPABASE_URL = "https://lrkwgebenfsdstistqdc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Eyr7DZSOEP0lPFAK2VlIVA_ze4gfBOS";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentLang = 'ko';
    let salesDataStore = [];

    const translations = {
        ko: {
            title: "항텅솜분 판매 수익 관리",
            langBtn: "ภาษาไทย로 변경",

            btnReset: "초기화",
            totalSelling: "총 판매가 합계",
            totalCost: "총 매입가 합계",
            totalProfit: "총 수익 합계",
            tfLabel: "조회 기간 합계",
            thId: "순번",
            thSaleDate: "날짜",
            thItemType: "종류",
            thWeight: "무게(g)",
            thChannel: "유입경로",
            thCustomer: "고객명",
            thPhone: "전화번호",
            thSelling: "판매가",
            thCost: "매입가",
            thProfit: "수익",
            thRemit: "송금은행",

            thAction: "관리",
            btnEdit: "수정",
            btnDelete: "삭제",
            confirmDelete: "정말로 삭제하시겠습니까?",
            saveSuccess: "성공적으로 저장되었습니다.",

        },
        th: {
            title: "ระบบจัดการรายได้ทองไทย",
            langBtn: "한국어로 변경",
            saleDate: "1. วันที่",
            itemType: "2-1. ประเภทสินค้า",
            weight: "2-2. น้ำหนัก (กรัม)",
            channel: "3-1. ช่องทาง",
            customerName: "3-2. ชื่อลูกค้า",
            phone: "3-3. เบอร์โทรศัพท์",
            sellingPrice: "4-1. ราคาขาย",
            costPrice: "4-2. ราคารับซื้อ",
            profit: "4-3. กำไร (คำนวณอัตโนมัติ)",
            remitBank: "5. ธนาคารโอน",
            depositBank: "6. ธนาคารรับเงิน",
            submitBtn: "บันทึกข้อมูล",
            updateBtn: "บันทึกการแก้ไข",
            cancelBtn: "ยกเลิก",
            filterStart: "วันที่เริ่มต้น",
            filterEnd: "วันที่สิ้นสุด",
            btnSearch: "ค้นหา",
            btnReset: "รีเซ็ต",
            totalSelling: "ยอดขายรวม",
            totalCost: "ต้นทุนรวม",
            totalProfit: "กำไรสุทธิรวม",
            tfLabel: "รวมตามช่วงเวลาที่ค้นหา",
            thId: "ลำดับ",
            thSaleDate: "วันที่",
            thItemType: "ประเภท",
            thWeight: "น้ำหนัก(g)",
            thChannel: "ช่องทาง",
            thCustomer: "ชื่อลูกค้า",
            thPhone: "เบอร์โทร",
            thSelling: "ราคาขาย",
            thCost: "ราคารับซื้อ",
            thProfit: "กำไร",
            thRemit: "ธนาคารโอน",
            thDeposit: "ธนาคารรับเงิน",
            thAction: "จัดการ",
            btnEdit: "แก้ไข",
            btnDelete: "ลบ",
            confirmDelete: "คุณต้องการลบข้อมูลนี้ใช่หรือไม่?",
            saveSuccess: "บันทึกข้อมูลเรียบร้อยแล้ว",
            updateSuccess: "แก้ไขข้อมูลเรียบร้อยแล้ว",
            deleteSuccess: "ลบข้อมูลเรียบร้อยแล้ว"
        }
    };

    function setDefaultDate() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('sale_date').value = today;
    }

    function toggleLanguage() {
        currentLang = currentLang === 'ko' ? 'th' : 'ko';
        const t = translations[currentLang];

        document.getElementById('title-text').innerText = t.title;
        document.getElementById('lang-toggle-btn').innerText = t.langBtn;
        document.getElementById('lbl-sale-date').innerText = t.saleDate;
        document.getElementById('lbl-item-type').innerText = t.itemType;
        document.getElementById('lbl-weight').innerText = t.weight;
        document.getElementById('lbl-channel').innerText = t.channel;
        document.getElementById('lbl-customer-name').innerText = t.customerName;
        document.getElementById('lbl-phone').innerText = t.phone;
        document.getElementById('lbl-selling-price').innerText = t.sellingPrice;
        document.getElementById('lbl-cost-price').innerText = t.costPrice;
        document.getElementById('lbl-profit').innerText = t.profit;
        document.getElementById('lbl-remit-bank').innerText = t.remitBank;
        document.getElementById('lbl-deposit-bank').innerText = t.depositBank;

        document.getElementById('lbl-filter-start').innerText = t.filterStart;
        document.getElementById('lbl-filter-end').innerText = t.filterEnd;
        document.getElementById('btn-search').innerText = t.btnSearch;
        document.getElementById('btn-reset').innerText = t.btnReset;

        document.getElementById('lbl-total-selling').innerText = t.totalSelling;
        document.getElementById('lbl-total-cost').innerText = t.totalCost;
        document.getElementById('lbl-total-profit').innerText = t.totalProfit;
        document.getElementById('tf-label').innerText = t.tfLabel;

        const editId = document.getElementById('edit_id').value;
        document.getElementById('btn-submit').innerText = editId ? t.updateBtn : t.submitBtn;
        document.getElementById('btn-cancel').innerText = t.cancelBtn;

        document.getElementById('th-id').innerText = t.thId;
        document.getElementById('th-sale-date').innerText = t.thSaleDate;
        document.getElementById('th-item-type').innerText = t.thItemType;
        document.getElementById('th-weight').innerText = t.thWeight;
        document.getElementById('th-channel').innerText = t.thChannel;
        document.getElementById('th-customer').innerText = t.thCustomer;
        document.getElementById('th-phone').innerText = t.thPhone;
        document.getElementById('th-selling').innerText = t.thSelling;
        document.getElementById('th-cost').innerText = t.thCost;
        document.getElementById('th-profit').innerText = t.thProfit;
        document.getElementById('th-remit').innerText = t.thRemit;
        document.getElementById('th-deposit').innerText = t.thDeposit;
        document.getElementById('th-action').innerText = t.thAction;

        renderTableAndTotals(salesDataStore);
    }

    function calculateProfit() {
        const selling = parseFloat(document.getElementById('selling_price').value) || 0;
        const cost = parseFloat(document.getElementById('cost_price').value) || 0;
        document.getElementById('profit').value = (selling - cost).toFixed(2);
    }

    document.getElementById('sales-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const t = translations[currentLang];
        const editId = document.getElementById('edit_id').value;

        const formData = {
            sale_date: document.getElementById('sale_date').value,
            item_type: document.getElementById('item_type').value,
            weight_g: parseFloat(document.getElementById('weight_g').value),
            channel: document.getElementById('channel').value,
            customer_name: document.getElementById('customer_name').value,
            phone: document.getElementById('phone').value,
            selling_price: parseFloat(document.getElementById('selling_price').value),
            cost_price: parseFloat(document.getElementById('cost_price').value),
            remit_bank: document.getElementById('remit_bank').value,
            deposit_bank: document.getElementById('deposit_bank').value
        };

        if (editId) {
            // 수정
            const { error } = await supabaseClient
                .from('gold_sales')
                .update(formData)
                .eq('id', editId);

            if (error) {
                alert(error.message);
            } else {
                alert(t.updateSuccess);
                cancelEdit();
                loadSalesData();
            }
        } else {
            // 등록
            const { error } = await supabaseClient
                .from('gold_sales')
                .insert([formData]);

            if (error) {
                alert(error.message);
            } else {
                alert(t.saveSuccess);
                document.getElementById('sales-form').reset();
                setDefaultDate();
                document.getElementById('profit').value = "0";
                loadSalesData();
            }
        }
    });

    function editRow(id) {
        const row = salesDataStore.find(item => item.id === id);
        if (!row) return;

        const t = translations[currentLang];
        document.getElementById('edit_id').value = row.id;
        document.getElementById('sale_date').value = row.sale_date || new Date().toISOString().split('T')[0];
        document.getElementById('item_type').value = row.item_type;
        document.getElementById('weight_g').value = row.weight_g;
        document.getElementById('channel').value = row.channel;
        document.getElementById('customer_name').value = row.customer_name;
        document.getElementById('phone').value = row.phone || '';
        document.getElementById('selling_price').value = row.selling_price;
        document.getElementById('cost_price').value = row.cost_price;
        document.getElementById('remit_bank').value = row.remit_bank || '';
        document.getElementById('deposit_bank').value = row.deposit_bank || '';
        calculateProfit();

        document.getElementById('btn-submit').innerText = t.updateBtn;
        document.getElementById('btn-cancel').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        const t = translations[currentLang];
        document.getElementById('edit_id').value = '';
        document.getElementById('sales-form').reset();
        setDefaultDate();
        document.getElementById('profit').value = "0";
        document.getElementById('btn-submit').innerText = t.submitBtn;
        document.getElementById('btn-cancel').style.display = 'none';
    }

    async function deleteRow(id) {
        const t = translations[currentLang];
        if (!confirm(t.confirmDelete)) return;

        const { error } = await supabaseClient
            .from('gold_sales')
            .delete()
            .eq('id', id);

        if (error) {
            alert(error.message);
        } else {
            alert(t.deleteSuccess);
            if (document.getElementById('edit_id').value == id) {
                cancelEdit();
            }
            loadSalesData();
        }
    }

    async function loadSalesData() {
        const startDate = document.getElementById('filter_start_date').value;
        const endDate = document.getElementById('filter_end_date').value;

        let query = supabaseClient
            .from('gold_sales')
            .select('*');

        if (startDate) {
            query = query.gte('sale_date', startDate);
        }
        if (endDate) {
            query = query.lte('sale_date', endDate);
        }

        const { data, error } = await query.order('id', { ascending: false });

        if (error) {
            console.error('Data fetch error:', error);
            return;
        }

        salesDataStore = data || [];
        renderTableAndTotals(salesDataStore);
    }

    function resetFilter() {
        document.getElementById('filter_start_date').value = '';
        document.getElementById('filter_end_date').value = '';
        loadSalesData();
    }

    function renderTableAndTotals(data) {
        const t = translations[currentLang];
        const tbody = document.getElementById('sales-list');
        tbody.innerHTML = '';

        let totalSelling = 0;
        let totalCost = 0;
        let totalProfit = 0;

        data.forEach(row => {
            const selling = Number(row.selling_price) || 0;
            const cost = Number(row.cost_price) || 0;
            const profit = Number(row.profit) || 0;

            totalSelling += selling;
            totalCost += cost;
            totalProfit += profit;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.id}</td>
                <td>${row.sale_date || '-'}</td>
                <td>${row.item_type}</td>
                <td>${row.weight_g}</td>
                <td>${row.channel}</td>
                <td>${row.customer_name}</td>
                <td>${row.phone || '-'}</td>
                <td>${selling.toLocaleString()}</td>
                <td>${cost.toLocaleString()}</td>
                <td class="profit-text">${profit.toLocaleString()}</td>
                <td>${row.remit_bank || '-'}</td>
                <td>${row.deposit_bank || '-'}</td>
                <td>
                    <div class="action-btn-group">
                        <button class="btn-edit" onclick="editRow(${row.id})">${t.btnEdit}</button>
                        <button class="btn-delete" onclick="deleteRow(${row.id})">${t.btnDelete}</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // 요약 대시보드 및 테이블 푸터 합계 갱신
        document.getElementById('val-total-selling').innerText = totalSelling.toLocaleString();
        document.getElementById('val-total-cost').innerText = totalCost.toLocaleString();
        document.getElementById('val-total-profit').innerText = totalProfit.toLocaleString();

        document.getElementById('tf-total-selling').innerText = totalSelling.toLocaleString();
        document.getElementById('tf-total-cost').innerText = totalCost.toLocaleString();
        document.getElementById('tf-total-profit').innerText = totalProfit.toLocaleString();
    }

    window.onload = () => {
        setDefaultDate();
        loadSalesData();
    };
</script>

</body>
</html>
